name: accessible_radio_player
description: An accessible radio player app for streaming online radio stations with full support for blind users.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  record: ^5.1.2
  flutter_tts: ^4.0.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
